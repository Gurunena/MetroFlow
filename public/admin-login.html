<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetroFlow – Depot Control Room</title>
  <meta name="description" content="MetroFlow operator sign in. Authorized personnel only.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body class="mf-auth-page is-depot">

  <main class="mf-auth-shell" id="main">

    <div class="mf-auth-card">
      <a class="mf-auth-brand" href="index.html">
        <img src="images/logo-mark.svg" alt="" width="38" height="38">
        <span>Metro<i>Flow</i></span>
      </a>

      <h1 class="h4 mb-0"><span class="mf-auth-script">Depot Control Room</span></h1>
      <p class="mf-auth-lede">Operator access to the MetroFlow fleet.</p>

      <div class="mf-auth-notice">
        <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
        Authorized personnel only. Access attempts are rate-limited.
      </div>

      <div class="mf-auth-alert" id="adminAlert" role="alert" aria-live="assertive"></div>

      <form id="adminForm" novalidate>
        <div class="mf-auth-field">
          <label for="adminUser">Operator username</label>
          <input type="text" id="adminUser" name="User" autocomplete="username" placeholder="admin">
          <div class="mf-auth-msg"></div>
        </div>

        <div class="mf-auth-field mf-auth-has-eye">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="Password" autocomplete="current-password" placeholder="Your password">
          <button class="mf-auth-eye" type="button" data-for="adminPassword" aria-label="Show password">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
          <div class="mf-auth-msg"></div>
        </div>

        <!-- Human check: drag the bus to the stop (client-side only) -->
        <label class="mf-auth-check mb-1" for="adminHandle">Slide the bus to the stop to continue</label>
        <div class="mf-auth-slider" id="adminSlider">
          <div class="mf-auth-slider-fill" id="adminSliderFill"></div>
          <div class="mf-auth-slider-track" id="adminSliderText">Drag the bus all the way right →</div>
          <span class="mf-auth-flag" aria-hidden="true"><i class="bi bi-sign-stop-fill"></i></span>
          <button class="mf-auth-slider-handle" type="button" id="adminHandle"
                  role="slider" aria-label="Drag the bus to the stop"
                  aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <i class="bi bi-bus-front-fill" aria-hidden="true"></i>
          </button>
        </div>

        <button type="submit" class="mf-auth-submit" id="adminSubmit" disabled>
          Open the gate <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
        </button>

        <div class="mf-auth-lockout" id="adminLockout" role="status" aria-live="polite">
          Too many attempts. Try again in <span id="adminLockCount">30</span>s.
        </div>
      </form>

      <p class="mf-auth-foot">
        Not an operator? <a class="mf-auth-link" href="login.html">Passenger sign in</a>
      </p>
    </div>

    <!-- Night depot scene -->
    <div class="mf-auth-scene" id="mfScene" aria-hidden="true">
      <div class="mf-auth-sun"></div>
      <div class="mf-auth-cloud mf-auth-cloud-1"></div>
      <div class="mf-auth-cloud mf-auth-cloud-3"></div>
      <div class="mf-auth-hills mf-auth-hills-back"></div>
      <div class="mf-auth-hills mf-auth-hills-front"></div>
      <div class="mf-auth-light"><i></i><i></i></div>

      <div class="mf-auth-barrier-post"></div>
      <div class="mf-auth-barrier"></div>

      <div class="mf-auth-speed"><span></span><span></span><span></span></div>

      <div class="mf-auth-bus">
        <img src="images/metroflow-bus.svg" alt="">
        <div class="mf-auth-wheel mf-auth-wheel-1"></div>
        <div class="mf-auth-wheel mf-auth-wheel-2"></div>
        <div class="mf-auth-beam"></div>
      </div>

      <div class="mf-auth-puff"></div>
      <div class="mf-auth-puff mf-auth-puff-2"></div>

      <div class="mf-auth-alarm"></div>
      <div class="mf-auth-road"></div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
