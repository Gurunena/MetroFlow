<!-- chat-widget.html – the Metro AI component.
     Injected into #chatWidget as a floating widget on every page, and into
     the .mfc-page container on assistant.html as a full-page view (chat.css
     restyles it, the markup is identical). -->
<button class="mfc-fab" id="chatFab" type="button" aria-label="Open Metro AI chat" aria-controls="chatPanel" aria-expanded="false">
  <i class="bi bi-robot" aria-hidden="true"></i><span class="mfc-ping" aria-hidden="true"></span>
</button>

<section class="mfc-panel" id="chatPanel" role="dialog" aria-label="Metro AI assistant" aria-modal="false">
  <header class="mfc-head">
    <span class="mfc-robot"><i class="bi bi-robot" aria-hidden="true"></i></span>
    <div class="flex-grow-1">
      <div class="mfc-title">Metro AI</div>
      <div class="mfc-status">
        <i class="bi bi-circle-fill" aria-hidden="true"></i> Online · replies instantly
      </div>
    </div>
    <button class="mfc-close" type="button" aria-label="Close chat"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </header>

  <!-- Messages are appended here by chat.js -->
  <div class="mfc-body" id="chatBody" role="log" aria-live="polite" aria-relevant="additions"></div>

  <!-- Quick-reply chips, rebuilt per turn -->
  <div class="mfc-chips" id="chatChips"></div>

  <form class="mfc-form" id="chatForm">
    <label class="visually-hidden" for="chatInput">Message Metro AI</label>
    <input id="chatInput" class="mfc-input" placeholder="e.g. Colombo to Kandy tomorrow" autocomplete="off" maxlength="300">
    <button class="mfc-send" type="submit" aria-label="Send message"><i class="bi bi-send-fill" aria-hidden="true"></i></button>
  </form>
</section>
