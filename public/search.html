<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetroFlow – Search buses</title>
  <meta name="description" content="Search MetroFlow metro bus services by route, date and passengers, and pick your seats.">
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -> Icons -> style.css -> home.css -> search.css -> chat.css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
  <link href="css/search.css" rel="stylesheet">
  <link href="css/chat.css" rel="stylesheet">
</head>
<body class="mf-sr-page">
  <div id="navbar"></div>

  <main id="main" class="container py-4">

    <!-- ============================ SEARCH BAR ========================== -->
    <h1 class="h4 mb-3">Find your bus</h1>

    <form class="mf-sr-searchbar" id="srForm" novalidate>
      <div class="mf-sr-grid">
        <div class="mf-sr-field mf-sr-f-from">
          <label for="srFrom">From</label>
          <input type="text" id="srFrom" name="from" list="srPlaces" placeholder="Colombo" autocomplete="off">
          <div class="mf-sr-msg" id="srFromMsg">Please enter a departure city.</div>
        </div>

        <button type="button" class="mf-sr-swap" id="srSwap" aria-label="Swap From and To">
          <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
        </button>

        <div class="mf-sr-field mf-sr-f-to">
          <label for="srTo">To</label>
          <input type="text" id="srTo" name="to" list="srPlaces" placeholder="Kandy" autocomplete="off">
          <div class="mf-sr-msg" id="srToMsg">Please enter a destination.</div>
        </div>

        <div class="mf-sr-field mf-sr-f-date">
          <label for="srDate">Date</label>
          <input type="date" id="srDate" name="date">
          <div class="mf-sr-msg" id="srDateMsg">Pick today or a later date.</div>
        </div>

        <div class="mf-sr-field mf-sr-f-pax">
          <label for="srPax">Passengers</label>
          <select id="srPax" name="pax">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          </select>
          <div class="mf-sr-msg" id="srPaxMsg">Between 1 and 6 passengers.</div>
        </div>

        <button type="submit" class="mf-sr-btn-primary mf-sr-f-go">
          <i class="bi bi-search" aria-hidden="true"></i> Search
        </button>
      </div>

      <!-- Populated from /api/buses/locations, with these as the baseline -->
      <datalist id="srPlaces">
        <option value="Colombo"></option><option value="Kandy"></option><option value="Galle"></option>
        <option value="Jaffna"></option><option value="Ella"></option><option value="Nuwara Eliya"></option>
        <option value="Matara"></option><option value="Anuradhapura"></option><option value="Makubura"></option>
        <option value="Trincomalee"></option>
      </datalist>
    </form>

    <!-- ============================= SUMMARY ============================ -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-3 mb-3">
      <p class="mf-sr-summary mb-0" id="srSummary" aria-live="polite"></p>
      <button type="button" class="mf-sr-btn mf-sr-filter-toggle" id="srFilterToggle"
              aria-expanded="false" aria-controls="srFilters">
        <i class="bi bi-sliders" aria-hidden="true"></i> Filters
      </button>
    </div>

    <div class="row g-4">
      <!-- ============================ FILTERS =========================== -->
      <div class="col-lg-3">
        <div class="mf-sr-filters" id="srFilters">
          <div class="mf-sr-fgroup">
            <div class="mf-sr-ftitle">Sort by</div>
            <label class="visually-hidden" for="srSort">Sort results</label>
            <select id="srSort" class="form-select form-select-sm">
              <option value="cheapest">Cheapest first</option>
              <option value="earliest">Earliest departure</option>
              <option value="latest">Latest departure</option>
              <option value="seats">Most seats</option>
              <option value="duration">Shortest duration</option>
            </select>
          </div>

          <div class="mf-sr-fgroup">
            <div class="mf-sr-ftitle">Departure time</div>
            <label class="mf-sr-check"><input type="checkbox" class="sr-time" value="morning"> Morning <span class="mf-sr-count">05:00–11:59</span></label>
            <label class="mf-sr-check"><input type="checkbox" class="sr-time" value="afternoon"> Afternoon <span class="mf-sr-count">12:00–17:59</span></label>
            <label class="mf-sr-check"><input type="checkbox" class="sr-time" value="evening"> Evening <span class="mf-sr-count">18:00–23:59</span></label>
            <label class="mf-sr-check"><input type="checkbox" class="sr-time" value="night"> Night <span class="mf-sr-count">00:00–04:59</span></label>
          </div>

          <div class="mf-sr-fgroup">
            <div class="mf-sr-ftitle">Price (LKR)</div>
            <div class="mf-sr-price">
              <label class="visually-hidden" for="srMin">Minimum fare</label>
              <input type="number" id="srMin" min="0" step="50" placeholder="Min" inputmode="numeric">
              <span class="mf-sr-count">to</span>
              <label class="visually-hidden" for="srMax">Maximum fare</label>
              <input type="number" id="srMax" min="0" step="50" placeholder="Max" inputmode="numeric">
            </div>
          </div>

          <div class="mf-sr-fgroup">
            <label class="mf-sr-check">
              <input type="checkbox" id="srEnough"> Only buses with enough seats
            </label>
          </div>

          <div class="mf-sr-fgroup" id="srNameGroup">
            <div class="mf-sr-ftitle">Bus</div>
            <div id="srNames"></div>
          </div>

          <button type="button" class="mf-sr-btn w-100" id="srReset">
            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reset filters
          </button>
        </div>
      </div>

      <!-- ============================ RESULTS =========================== -->
      <div class="col-lg-9">
        <div id="srResults" aria-busy="false"></div>
        <nav class="mf-sr-pager" id="srPager" aria-label="Results pages"></nav>
      </div>
    </div>

  </main>

  <div id="footer"></div>
  <div id="chatWidget"></div>

  <!-- jQuery -> Bootstrap JS -> api.js -> auth.js -> main.js -> search.js -> chat.js -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
  <script src="js/search.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
