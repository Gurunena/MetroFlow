<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passengers – MetroFlow Operator</title>
  <meta name="description" content="Operator tools: add, view, update and delete MetroFlow passengers.">
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <!-- Same stylesheets as the operator dashboard (admin.html) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="mf-admin-page">
  <div id="navbar"></div>

  <main id="main">
    <section class="container py-4">

      <!-- Header – same layout as the operator dashboard -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mf-admin-head">
        <div>
          <span class="mf-admin-eyebrow">Operator dashboard</span>
          <h1 class="h3 mt-1 mb-0">Passenger management</h1>
          <p class="mf-muted small mb-0 mt-1">Add, view, update and delete registered passengers.</p>
        </div>
        <a class="mf-btn-ghost btn-sm text-decoration-none" href="admin.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Dashboard
        </a>
      </div>

      <!-- Same tabs as admin.html, with Passengers active -->
      <ul class="nav nav-pills mb-3">
        <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-bus-front" aria-hidden="true"></i> Buses</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-ticket-perforated" aria-hidden="true"></i> Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-signpost-split" aria-hidden="true"></i> Schedules</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="passenger-details.html"><i class="bi bi-people" aria-hidden="true"></i> Passengers</a></li>
      </ul>

      <div class="row g-3">

        <!-- ADD / UPDATE PASSENGER -->
        <div class="col-lg-4">
          <div class="mf-admin-panel h-100">
            <h2 class="h6 fw-bold mb-3" id="formTitle">Add Passenger</h2>

            <form id="passengerForm" novalidate>
              <input type="hidden" id="passengerId">
              <div id="formErrors" class="alert alert-danger small" style="display:none" role="alert"></div>

              <div class="mb-2">
                <label class="form-label small fw-semibold" for="fullName">Full name *</label>
                <input class="form-control" type="text" id="fullName" placeholder="e.g. Nimal Perera" maxlength="60" required>
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold" for="nic">NIC / Passport *</label>
                <input class="form-control" type="text" id="nic" placeholder="e.g. 200012345678" required>
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold" for="phone">Phone *</label>
                <input class="form-control" type="tel" id="phone" placeholder="0771234567" required>
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold" for="email">Email *</label>
                <input class="form-control" type="email" id="email" placeholder="name@example.com" required>
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold" for="address">Address</label>
                <input class="form-control" type="text" id="address" placeholder="e.g. Colombo 07" maxlength="150">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold" for="gender">Gender</label>
                <select class="form-select" id="gender">
                  <option value="">Select gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" id="savePassengerBtn" class="mf-btn-red btn-sm">
                  <i class="bi bi-person-plus" aria-hidden="true"></i> Add Passenger
                </button>
                <button type="button" id="cancelEditBtn" class="mf-btn-ghost btn-sm" hidden>Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <!-- PASSENGER LIST -->
        <div class="col-lg-8">
          <div class="mf-admin-panel h-100">
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
              <h2 class="h6 fw-bold mb-0">Registered passengers</h2>
              <label class="visually-hidden" for="passengerSearch">Search passengers</label>
              <input class="form-control" style="max-width:320px" type="search" id="passengerSearch"
                     placeholder="Search by ID, name, NIC, phone, email…">
            </div>

            <div id="passengerMessage"></div>

            <div class="mf-admin-scroll">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Passenger</th>
                    <th>NIC / Passport</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="passengerTableBody">
                  <tr><td colspan="6" class="mf-admin-state">Loading passengers…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- VIEW PASSENGER DETAILS -->
  <div class="modal fade" id="passengerDetailsModal" tabindex="-1" aria-labelledby="passengerDetailsTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-0 pb-0">
          <div>
            <span class="mf-admin-eyebrow">Passenger</span>
            <h2 class="modal-title h5 mb-0" id="passengerDetailsTitle">Passenger details</h2>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="passengerDetailsContent"></div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <!-- jQuery -> Bootstrap JS -> api.js -> auth.js -> main.js -> page script -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/passenger-details.js"></script>
</body>
</html>
