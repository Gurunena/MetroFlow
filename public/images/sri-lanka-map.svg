      <stop offset="0" stop-color="#FFE3E5"/>
      <stop offset="1" stop-color="#FFC9CD"/>
    </linearGradient>
  </defs>
  <!-- Island silhouette (stylised) -->
  <path d="M62 18 C74 10 92 14 96 26 C100 36 92 44 98 54 C108 70 124 84 136 102 C150 122 166 140 176 164
           C186 190 188 220 178 246 C168 272 146 292 120 302 C100 308 84 304 74 292 C60 276 52 252 48 228
           C44 204 46 182 50 160 C54 138 56 116 58 96 C60 78 54 66 50 54 C46 40 50 26 62 18 Z"
        fill="url(#land)" stroke="#F3A6AC" stroke-width="2"/>
  <path d="M40 30 C48 26 56 26 60 30 C56 34 48 36 40 34 Z" fill="#FFC9CD"/>
  <!-- routes -->
  <g fill="none" stroke="#D80F1E" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round">
    <path d="M70 34 C80 90 70 160 62 212"/>
    <path d="M62 212 C88 204 108 198 124 190"/>
    <path d="M62 212 C64 240 74 262 86 282"/>
  </g>
  <!-- pins -->
  <g font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="11" font-weight="700" fill="#0F1B33">
    <g transform="translate(70 34)"><circle r="9" fill="#D80F1E" opacity=".18"/><circle r="4.5" fill="#D80F1E"/><text x="10" y="-6">Jaffna</text></g>
    <g transform="translate(124 190)"><circle r="9" fill="#D80F1E" opacity=".18"/><circle r="4.5" fill="#D80F1E"/><text x="10" y="4">Kandy</text></g>
    <g transform="translate(62 212)"><circle r="11" fill="#D80F1E" opacity=".18"/><circle r="5.5" fill="#D80F1E"/><text x="-50" y="4">Colombo</text></g>
    <g transform="translate(86 282)"><circle r="9" fill="#D80F1E" opacity=".18"/><circle r="4.5" fill="#D80F1E"/><text x="10" y="4">Galle</text></g>
  </g>
</svg>
