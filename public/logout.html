<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetroFlow – Signed out</title>
  <meta name="description" content="You have been signed out of MetroFlow. See you on the road!">
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body class="mf-auth-page is-sunset">

  <main class="mf-auth-shell" id="main">

    <div class="mf-auth-card text-center">
      <a class="mf-auth-brand" href="index.html" style="justify-content:center;width:100%">
        <img src="images/logo-mark.svg" alt="" width="38" height="38">
        <span>Metro<i>Flow</i></span>
      </a>

      <h1 class="h4 mb-0"><span class="mf-auth-script">See you on the road!</span> 👋</h1>
      <p class="mf-auth-lede">You're signed out and the bus is heading back to the depot.</p>

      <div class="d-grid gap-2">
        <a class="mf-auth-submit" href="login.html">
          <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Sign in again
        </a>
        <a class="mf-auth-back text-center" href="index.html" style="text-decoration:none">
          <i class="bi bi-house" aria-hidden="true"></i> Back to home
        </a>
      </div>

      <p class="mf-auth-foot" id="loAuto" aria-live="polite">
        Taking you home in <span class="mf-auth-countdown" id="loCount">6</span>s —
        <a class="mf-auth-link" href="#" id="loCancel">stay here</a>
      </p>
    </div>

    <!-- Sunset: the bus returns to the depot -->
    <div class="mf-auth-scene" id="mfScene" aria-hidden="true">
      <div class="mf-auth-sun"></div>
      <div class="mf-auth-cloud mf-auth-cloud-1"></div>
      <div class="mf-auth-cloud mf-auth-cloud-2"></div>
      <div class="mf-auth-cloud mf-auth-cloud-3"></div>
      <div class="mf-auth-hills mf-auth-hills-back"></div>
      <div class="mf-auth-hills mf-auth-hills-front"></div>
      <div class="mf-auth-palm mf-auth-palm-1"></div>
      <div class="mf-auth-palm mf-auth-palm-2"></div>
      <div class="mf-auth-stop"></div>

      <div class="mf-auth-bus">
        <img src="images/metroflow-bus.svg" alt="">
        <div class="mf-auth-wheel mf-auth-wheel-1"></div>
        <div class="mf-auth-wheel mf-auth-wheel-2"></div>
      </div>

      <div class="mf-auth-road"></div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
