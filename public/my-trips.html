<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Trips – MetroFlow</title>
  <meta name="description" content="Find, change or cancel your MetroFlow bus bookings.">
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -> Icons -> style.css -> home.css (shared tokens, navbar, footer) -> chat.css -> booking.css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
  <link href="css/chat.css" rel="stylesheet">
  <link href="css/booking.css" rel="stylesheet">
</head>
<body data-page="my-trips">
  <div id="navbar"></div>

  <main id="main">
    <!-- ===== Page header + search modes ===== -->
    <header class="bk-head">
      <div class="container">
        <nav class="bk-crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span aria-current="page">My Trips</span></nav>
        <h1 class="bk-title">My <span class="bk-script">trips</span></h1>
        <p class="bk-sub mb-3">Find, change or cancel your bookings &mdash; no account needed.</p>

        <div class="d-flex flex-wrap gap-2" id="searchModes" role="group" aria-label="Search by">
          <button type="button" class="bk-pill active" aria-pressed="true" data-type="id" data-icon="bi-hash" data-label="Booking ID" data-ph="e.g. BK20261015001">Booking ID</button>
          <button type="button" class="bk-pill" aria-pressed="false" data-type="passenger" data-icon="bi-person" data-label="Passenger name" data-ph="e.g. Kumara">Name</button>
          <button type="button" class="bk-pill" aria-pressed="false" data-type="phone" data-icon="bi-telephone" data-label="Phone number" data-ph="e.g. +94771001001">Phone</button>
          <button type="button" class="bk-pill" aria-pressed="false" data-type="email" data-icon="bi-envelope" data-label="Email" data-ph="e.g. kumara@gmail.com">Email</button>
          <button type="button" class="bk-pill" aria-pressed="false" data-type="bus" data-icon="bi-bus-front" data-label="Bus ID" data-ph="e.g. MB1001">Bus ID</button>
          <button type="button" class="bk-pill" aria-pressed="false" data-type="date" data-icon="bi-calendar-event" data-label="Travel date" data-ph="">Date</button>
        </div>
      </div>
    </header>

    <div class="container py-4 pb-5">
      <!-- ===== Booking search ===== -->
      <div class="bk-panel mb-4">
        <form id="searchForm" class="row g-2 align-items-center" novalidate>
          <div class="col-md">
            <div class="bk-field" id="searchField">
              <i class="bi bi-hash" id="searchIcon" aria-hidden="true"></i>
              <div class="flex-grow-1"><label for="searchValue" id="searchLabel">Booking ID</label>
                <input id="searchValue" placeholder="e.g. BK20261015001" autocomplete="off"></div>
            </div>
          </div>
          <div class="col-6 col-md-auto d-grid">
            <button type="submit" class="btn mf-btn-red py-3 text-nowrap">Find booking <i class="bi bi-search d-none d-sm-inline" aria-hidden="true"></i></button>
          </div>
          <div class="col-6 col-md-auto d-grid">
            <button type="button" id="showAllBtn" class="btn mf-btn-outline-red py-3 text-nowrap">Show all</button>
          </div>
        </form>
      </div>

      <!-- ===== MetroMiles (shown when the results belong to one passenger) ===== -->
      <div id="milesPanel" class="bk-panel bk-miles mb-4" style="display:none" aria-live="polite"></div>

      <!-- ===== Results ===== -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="resultCount" class="mf-muted" aria-live="polite"></span>
        <button type="button" class="bk-pill" id="hideCancelled" aria-pressed="false"><i class="bi bi-eye-slash" aria-hidden="true"></i> Hide cancelled</button>
      </div>
      <div id="results" class="row g-4">
        <div class="col-12 mf-state"><i class="bi bi-ticket-perforated" aria-hidden="true"></i>Search for a booking or click &ldquo;Show all&rdquo;.</div>
      </div>
    </div>
  </main>

  <!-- ===== View / update modal ===== -->
  <div class="modal fade bk-modal" id="editModal" tabindex="-1" aria-labelledby="editTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-2">
        <form id="editForm" novalidate>
          <div class="modal-header">
            <div>
              <h2 class="modal-title h5 mb-0" id="editTitle">Booking <span id="editId"></span></h2>
              <small class="mf-muted" id="editInfo"></small>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="bk-field mb-2"><i class="bi bi-person" aria-hidden="true"></i><div class="flex-grow-1">
              <label for="eName">Passenger name</label><input id="eName" name="Passenger_Name" required maxlength="60"></div></div>
            <div class="bk-field mb-2"><i class="bi bi-telephone" aria-hidden="true"></i><div class="flex-grow-1">
              <label for="ePhone">Phone</label><input id="ePhone" name="Phone" required></div></div>
            <div class="bk-field mb-2"><i class="bi bi-envelope" aria-hidden="true"></i><div class="flex-grow-1">
              <label for="eEmail">Email</label><input id="eEmail" type="email" name="Email" required></div></div>
            <div class="row g-2">
              <div class="col-8"><div class="bk-field"><i class="bi bi-geo-alt" aria-hidden="true"></i><div class="flex-grow-1">
                <label for="eBoarding">Boarding point</label><input id="eBoarding" name="Boarding_Point" maxlength="60"></div></div></div>
              <div class="col-4"><div class="bk-field"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i><div class="flex-grow-1">
                <label for="eSeat">Seat</label><input id="eSeat" name="Seat_Number" required maxlength="3"></div></div></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn mf-btn-ghost" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn mf-btn-red" id="saveBtn">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="footer"></div>
  <div id="chatWidget"></div>
  <div class="bk-toast" id="toast" role="status" aria-live="polite"></div>

  <!-- jQuery -> Bootstrap JS -> api.js -> main.js -> page script -> chat.js -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/booking-extras.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
